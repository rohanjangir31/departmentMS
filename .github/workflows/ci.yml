name: AcademiQ CI

# Runs on every push and pull-request to main and feature branches
on:
  push:
    branches: ["main", "feature/**", "fix/**", "chore/**"]
  pull_request:
    branches: ["main"]

jobs:
  # ─────────────────────────────────────────────────────────
  # Job 1: Backend — TypeScript compile + 26 automated tests
  # ─────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Type-check TypeScript
        run: npx tsc --noEmit

      - name: Run backend test suite
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_secret_academiq_2026
          # mongodb-memory-server provides its own in-memory MongoDB
          # so no MONGODB_URI is needed for tests

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────────
  # Job 2: Frontend — Next.js production build
  # ─────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build (Next.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Next.js (production)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: frontend/.next/
          retention-days: 1

  # ─────────────────────────────────────────────────────────
  # Job 3: Security audit (non-blocking, informational)
  # ─────────────────────────────────────────────────────────
  security-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    continue-on-error: true  # Informational — does not block merges

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
